name: Refresh profile card

on:
  schedule:
    - cron: "5 0 * * *" # daily, just after midnight UTC: the card alternates by day
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/profile/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Render assets/profile.svg
        run: uv run --no-project --with fonttools --with brotli python scripts/profile/build.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional fine-grained PAT with read access to repository metadata, so private repos are listed
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - name: Commit if changed
        run: |
          git add assets/profile.svg
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile card"
          git push
